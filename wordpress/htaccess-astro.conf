# Bloque de Astro para el .htaccess de public_html (specs/21-pase-a-produccion.md).
# Se pega a mano ARRIBA de "# BEGIN LSCACHE": el deploy nunca sube el .htaccess de la raíz.
# WordPress y LiteSpeed solo reescriben lo que está entre sus propios marcadores.

# BEGIN ERES Astro

# --- Parte previa -------------------------------------------------------------
# Se pega antes del primer deploy. Es inerte mientras no exista index.html.
DirectoryIndex index.html index.php

<IfModule mod_rewrite.c>
RewriteEngine On

# WooCommerce llama a /?wc-ajax=… y /?wc-api=… sobre la raíz, que pasa a ser el index.html de Astro.
RewriteCond %{QUERY_STRING} (^|&)(wc-ajax|wc-api|rest_route|p|page_id|preview)= [NC]
RewriteRule ^$ /index.php [L]
</IfModule>

# --- Parte definitiva ---------------------------------------------------------
# Se pega cuando el primer deploy terminó: antes rompería las páginas de WordPress.
ErrorDocument 404 /404.html

<IfModule mod_rewrite.c>
RewriteEngine On

RewriteRule ^product/([^/]+)/?$ /productos/$1/ [R=301,L]
RewriteRule ^product-category/([^/]+)/?$ /productos/categoria/$1/ [R=301,L]
RewriteRule ^blog/?$ /skin-journal/ [R=301,L]
RewriteRule ^blog/([^/]+)/?$ /skin-journal/$1/ [R=301,L]
RewriteRule ^cart/?$ /productos/?carrito=abierto [R=302,L]
RewriteRule ^my-account(/.*)?$ / [R=302,L]

# Lo que no existe y no es de WordPress responde el 404 de Astro, no el del tema.
# Una ruta nueva de WordPress (un plugin de pagos, por ejemplo) se agrega a esta lista.
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteCond %{REQUEST_URI} !^/(checkout|wp-json|wp-admin|wp-content|wp-includes|wc-api|wc-auth)(/|$)
RewriteRule . - [R=404,L]
</IfModule>

# END ERES Astro
