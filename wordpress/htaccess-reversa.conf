# Bloque de reversa para el .htaccess de public_html (specs/21-pase-a-produccion.md).
# Reemplaza al bloque "ERES Astro": devuelve el sitio de WordPress sin borrar los archivos de Astro.
# Solo sirve mientras las páginas de WordPress no se hayan borrado.

# BEGIN ERES Reversa
DirectoryIndex index.php index.html

<IfModule mod_rewrite.c>
RewriteEngine On

# Las carpetas de Astro existen en disco y le ganarían a la página de WordPress del mismo nombre.
RewriteRule ^(nosotras|servicios|contacto|productos|skin-journal|gracias|terminos-y-condiciones|cambios-y-devoluciones|libro-de-reclamaciones)(/.*)?$ /index.php [L]
</IfModule>
# END ERES Reversa
